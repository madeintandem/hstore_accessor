AllCops:
  NewCops: disable
  TargetRubyVersion: 3.3
  Include:
    - Rakefile
Layout/SpaceBeforeFirstArg:
  Enabled: false
Lint/UnusedBlockArgument:
  Enabled: false
Lint/UnusedMethodArgument:
  Enabled: false
Lint/ConstantDefinitionInBlock:
  # These specs intentionally define and reopen models to exercise the macro.
  Exclude:
    - spec/hstore_accessor_spec.rb
Metrics/AbcSize:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Layout/LineLength:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Layout/ParameterAlignment:
  Enabled: false
Style/ClassAndModuleChildren:
  Enabled: false
Style/ClassVars:
  Enabled: false
Style/Documentation:
  Enabled: false
Naming/FileName:
  Enabled: false
Style/GuardClause:
  Enabled: false
Layout/HashAlignment:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/SignalException:
  Enabled: false
Layout/SpaceAroundEqualsInParameterDefault:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
